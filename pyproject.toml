[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "partnerqc"
version = "0.1.0"
description = "Patient-based quality control of HbA1c using same-sample glucose as a distributional partner"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "openpyxl>=3.0"]

[project.scripts]
partnerqc = "partnerqc.cli:main"

[tool.setuptools]
packages = ["partnerqc"]

[project.urls]
Homepage = "https://pbrtqcpartner.netlify.app"
Source = "https://github.com/lamkienthanh92/PBRTQCpartner"
Archive = "https://doi.org/10.5281/zenodo.24076346"
